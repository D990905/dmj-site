<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coaching workbench QA — synthetic</title><link rel="stylesheet" href="css/coaching-workbench.css?v=qa2"><style>body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f7f9f8;color:#172322}main{max-width:1200px;margin:auto}button{padding:12px}</style><main><h1>Synthetic fixture — no real athlete data</h1><button id="empty">Empty state</button><button id="full">Synthetic events</button><button id="wind">Unknown wind</button><div id="host"></div></main><script src="js/coaching-workbench.js?v=qa2"></script><script>
const session={samples:Array.from({length:200},(_,i)=>({t:i,lat:35,lng:129,hr:100+i%30,heel:5*Math.sin(i/4),pitch:2*Math.cos(i/3)}))};const analysis={maneuvers:Array.from({length:8},(_,i)=>({type:i<6?'gybe':'tack',side:i%2?'P':'S',startIdx:i*20,endIdx:i*20+10,entrySpeedMs:6+i,lossPct:i*12,recoverySec:i+4,recoveryStatus:i===3?'censored':i===4?'not-recovered':'recovered'}))};function render(w=true){RDCoachingWorkbench.render(document.getElementById('host'),session,analysis,{windUsable:w})}document.getElementById('empty').onclick=()=>RDCoachingWorkbench.render(document.getElementById('host'),{samples:[]},{maneuvers:[]},{windUsable:false});document.getElementById('full').onclick=()=>render();document.getElementById('wind').onclick=()=>render(false);render();
</script></html>
