<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>라이딩 기록 복원</title><style>body{font:17px system-ui;background:#f8f8f3;color:#202622;max-width:720px;margin:8vh auto;padding:24px}button,a{display:inline-block;padding:16px;background:#e9ef38;color:#202622;border:0;margin:16px 0}pre{white-space:pre-wrap;line-height:1.7}</style><h1>라이딩 기록 복원</h1><p>백업을 이 브라우저로 가져옵니다. 원본 사이트의 기록은 변경되지 않습니다.</p><input id="file" type="file" accept=".json"><pre id="status">백업 파일을 선택하세요</pre><button id="restore" disabled>기록 복원</button><br><a href="v2.html">대시보드 열기</a><script>
let plan=null;const status=document.getElementById('status'),button=document.getElementById('restore');
document.getElementById('file').onchange=async e=>{try{plan=null;button.disabled=true;const b=JSON.parse(await e.target.files[0].text());if(b.version!==1||!b.data)throw Error('지원하지 않는 백업');const keys=Object.keys(b.data),sk=keys.filter(k=>/^rd_[0-9a-f-]{36}_sessions_v1$/.test(k));if(sk.length!==1)throw Error('회원별 백업이 필요합니다');const prefix=sk[0].slice(0,-11),allowed=/^(sessions_v1|track_v1_.+|edits_v1|titles_v1|videosync_v1|rider_v1|sessionqa_v1|workouts_v1|wellness_v1|rideloads_v1)$/;if(!keys.every(k=>k.startsWith(prefix)&&allowed.test(k.slice(prefix.length))&&typeof b.data[k]==='string'))throw Error('잘못된 저장 항목');const rows=JSON.parse(b.data[sk[0]]);if(!Array.isArray(rows)||rows.some(r=>!r.id||!Number.isFinite(r.dateEpoch)))throw Error('잘못된 라이딩 목록');const missing=rows.filter(r=>r.hasTrack&&!b.data[prefix+'track_v1_'+r.id]);if(missing.length)throw Error('GPS 트랙 누락');const writes={};let conflicts=0;for(const k of keys){const old=localStorage.getItem(k);if(old!==null&&old!==b.data[k]){conflicts++;continue}writes[k]=b.data[k]}if(conflicts)throw Error('기존 데이터와 다른 항목 '+conflicts+'개가 있어 덮어쓰기를 중단했습니다. 기존 기록을 먼저 백업해야 합니다');plan=writes;status.textContent=rows.length+'개 기록 · GPS '+keys.filter(k=>k.startsWith(prefix+'track_v1_')).length+'개\n'+new Date(Math.min(...rows.map(r=>r.dateEpoch))).toLocaleDateString('ko-KR')+' ~ '+new Date(Math.max(...rows.map(r=>r.dateEpoch))).toLocaleDateString('ko-KR');button.disabled=false}catch(err){status.textContent=err.message}};
button.onclick=()=>{if(!plan)return;const added=[];try{for(const [k,v] of Object.entries(plan)){if(localStorage.getItem(k)===null){localStorage.setItem(k,v);added.push(k)}if(localStorage.getItem(k)!==v)throw Error('검증 실패')}status.textContent+='\n복원 완료 · 저장값 검증 통과\n백업과 동일한 회원으로 로그인하면 기록을 볼 수 있습니다';button.disabled=true}catch(err){for(const k of added)localStorage.removeItem(k);status.textContent+='\n복원 실패: '+err.message+'\n기존 데이터는 유지되었습니다'}};
</script></html>
