<script>
/* §530 — 모바일 메뉴 + 로그인 상태. 두 줄이면 되는 걸 페이지마다
   다르게 써 놔서 동작이 제각각이었다. 여기 하나로 통일한다. */
(function () {
  var t = document.querySelector('.nav__toggle');
  var l = document.getElementById('nav-links');
  if (t && l) t.addEventListener('click', function () {
    var open = l.classList.toggle('is-open');
    t.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  /* 현재 페이지 표시 */
  var here = location.pathname.split('/').pop() || 'index.html';
  Array.prototype.forEach.call(document.querySelectorAll('.nav__link'), function (a) {
    if (a.getAttribute('href') === here) a.setAttribute('aria-current', 'page');
  });
  /* 로그인 상태 — DMJAuth 가 있으면 CTA 를 바꾼다 */
  function syncAuth() {
    var cta = document.getElementById('nav-auth-cta');
    if (!cta || !window.DMJAuth || !window.DMJAuth.isLoggedIn) return;
    if (window.DMJAuth.isLoggedIn()) {
      var u = window.DMJAuth.currentUser() || {};
      cta.textContent = (u.name || u.email || '내 정보');
      cta.href = 'profile.html';
    }
  }
  syncAuth();
  window.addEventListener('dmj-auth-change', syncAuth);
})();
</script>
