# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify all product galleries
        run: python3 scripts/check-product-galleries.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage public assets without internal control data
        run: |
          mkdir -p _site
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/.agents/' --exclude='/.codex/' --exclude='/_site/' --exclude='/_experts/' --exclude='/_team/' --exclude='/orchestrator/' --exclude='/admin/dashboard/' --exclude='dashboard-state.json' --exclude='dashboard-messages.json' --exclude='/admin/team-live.html' --exclude='/admin/work-status.json' ./ _site/
          mkdir -p _site/admin/dashboard
          cp admin/dashboard/index.html admin/dashboard/sw.js _site/admin/dashboard/
          test ! -e _site/admin/dashboard/dashboard-state.json
          test ! -e _site/admin/team-live.html
          test ! -e _site/_team
          test -z "$(find _site -type f \( -name 'dashboard-state.json' -o -name 'dashboard-messages.json' \) -print -quit)"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the staged public site
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
