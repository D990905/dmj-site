<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="샘 정 Sam Jung - DataViz Specialist">
  <title>샘 정 (Sam Jung) — DataViz Specialist</title>
  <defs>
    <clipPath id="c2"><circle cx="80" cy="80" r="78"/></clipPath>
  </defs>
  <g clip-path="url(#c2)">
    <rect width="160" height="160" fill="#E8F1FB"/>
    <rect width="160" height="20" y="140" fill="#D1E2F4"/>
    <!-- body / oat-coloured tee -->
    <path d="M28 160 C 38 130, 58 122, 80 122 C 102 122, 122 130, 132 160 Z" fill="#C9A77E"/>
    <!-- neck -->
    <rect x="73" y="108" width="14" height="20" fill="#EDC59F"/>
    <!-- crew neckline -->
    <ellipse cx="80" cy="132" rx="11" ry="5" fill="#A8854D"/>
    <!-- head -->
    <ellipse cx="80" cy="86" rx="26" ry="30" fill="#F2D0B0"/>
    <!-- hair — brown, shoulder-length, tied back (low pony hint) -->
    <path d="M52 80 C 52 56, 70 48, 80 48 C 95 48, 108 58, 108 80 L 105 100 L 102 76 L 80 64 L 60 70 L 55 100 Z" fill="#5C3A1F"/>
    <!-- pony tail hint behind head -->
    <ellipse cx="80" cy="120" rx="8" ry="14" fill="#5C3A1F" opacity="0.7"/>
    <!-- ears -->
    <ellipse cx="54" cy="88" rx="3" ry="5" fill="#EDC59F"/>
    <ellipse cx="106" cy="88" rx="3" ry="5" fill="#EDC59F"/>
    <!-- eyebrows -->
    <rect x="66" y="82" width="9" height="1.6" fill="#3D2817" rx="0.5"/>
    <rect x="85" y="82" width="9" height="1.6" fill="#3D2817" rx="0.5"/>
    <!-- round white glasses (Warby Parker Felix) -->
    <circle cx="71" cy="89" r="7" fill="none" stroke="#F8F9FB" stroke-width="1.6"/>
    <circle cx="89" cy="89" r="7" fill="none" stroke="#F8F9FB" stroke-width="1.6"/>
    <line x1="78" y1="89" x2="82" y2="89" stroke="#F8F9FB" stroke-width="1.6"/>
    <!-- eyes -->
    <circle cx="71" cy="89" r="1.5" fill="#1A1A1A"/>
    <circle cx="89" cy="89" r="1.5" fill="#1A1A1A"/>
    <!-- nose -->
    <path d="M80 93 L 78 99 L 82 99" fill="none" stroke="#C9A180" stroke-width="0.8" stroke-linecap="round"/>
    <!-- mouth — slight smile -->
    <path d="M74 106 Q 80 110 86 106" fill="none" stroke="#8B5C4A" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <circle cx="80" cy="80" r="78" fill="none" stroke="#0A2540" stroke-width="1.5"/>
  <!-- prop badge — bar chart -->
  <g transform="translate(118,118)">
    <circle r="20" fill="#FFFFFF" stroke="#0A2540" stroke-width="1.2"/>
    <rect x="-10" y="-2" width="3.5" height="10" fill="#1F8FFF"/>
    <rect x="-5" y="-7" width="3.5" height="15" fill="#FFB800"/>
    <rect x="0" y="-4" width="3.5" height="12" fill="#1FA055"/>
    <rect x="5" y="0" width="3.5" height="8" fill="#EC8A2E"/>
    <line x1="-11" y1="9" x2="10" y2="9" stroke="#0A2540" stroke-width="0.8"/>
  </g>
</svg>
