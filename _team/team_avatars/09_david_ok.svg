<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="데이빗 옥 David Ok - Chief of Staff Orchestrator">
  <title>데이빗 옥 (David Ok) — Chief of Staff &amp; Orchestrator</title>
  <defs>
    <clipPath id="c9"><circle cx="80" cy="80" r="78"/></clipPath>
  </defs>
  <g clip-path="url(#c9)">
    <!-- bg — warm navy-tinted with subtle gold accent -->
    <rect width="160" height="160" fill="#F0EEE5"/>
    <rect width="160" height="20" y="140" fill="#E0DCC8"/>
    <!-- subtle background sun rays (orchestrator feel) -->
    <g opacity="0.25" stroke="#FFB800" stroke-width="0.6" fill="none">
      <line x1="20" y1="20" x2="40" y2="40"/>
      <line x1="140" y1="20" x2="120" y2="40"/>
      <line x1="80" y1="10" x2="80" y2="20"/>
    </g>
    <!-- body — navy cardigan over white oxford shirt -->
    <path d="M28 160 C 38 128, 58 120, 80 120 C 102 120, 122 128, 132 160 Z" fill="#21304A"/>
    <!-- cardigan opening — V neck shape with shirt collar -->
    <path d="M68 124 L 80 138 L 92 124 L 88 122 L 80 130 L 72 122 Z" fill="#F8F9FB"/>
    <!-- shirt collar tips -->
    <path d="M73 130 L 78 134 L 75 142 Z" fill="#F8F9FB" stroke="#C7CFD8" stroke-width="0.5"/>
    <path d="M87 130 L 82 134 L 85 142 Z" fill="#F8F9FB" stroke="#C7CFD8" stroke-width="0.5"/>
    <!-- cardigan button hint -->
    <circle cx="80" cy="148" r="1.2" fill="#FFB800"/>
    <circle cx="80" cy="154" r="1.2" fill="#FFB800"/>
    <!-- neck -->
    <rect x="73" y="108" width="14" height="18" fill="#E5B58A"/>
    <!-- head -->
    <ellipse cx="80" cy="86" rx="25" ry="29" fill="#F2D0B0"/>
    <!-- hair — short side-part, black with grey temples -->
    <path d="M55 75 C 56 56, 70 48, 80 48 C 95 48, 105 56, 106 76 L 100 74 L 96 66 Q 88 60 80 60 Q 70 60 64 68 L 60 76 Z" fill="#1A1A1A"/>
    <!-- side part — diagonal line of slight asymmetry -->
    <path d="M75 56 Q 76 62 78 66 Q 80 68 82 66 L 84 60" fill="#0F0F0F"/>
    <!-- grey at temple -->
    <path d="M56 75 L 58 84 L 62 84 L 60 75 Z" fill="#9B9590"/>
    <path d="M104 75 L 102 84 L 98 84 L 100 75 Z" fill="#9B9590"/>
    <!-- ears -->
    <ellipse cx="55" cy="88" rx="3" ry="5" fill="#EDC59F"/>
    <ellipse cx="105" cy="88" rx="3" ry="5" fill="#EDC59F"/>
    <!-- eyebrows — neat, slight arch -->
    <path d="M65 82 Q 70 80.5 75 82" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M85 82 Q 90 80.5 95 82" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
    <!-- thin metal round glasses (Ray-Ban Round) -->
    <circle cx="71" cy="89" r="6.5" fill="none" stroke="#3A3F44" stroke-width="0.9"/>
    <circle cx="89" cy="89" r="6.5" fill="none" stroke="#3A3F44" stroke-width="0.9"/>
    <line x1="77.5" y1="89" x2="82.5" y2="89" stroke="#3A3F44" stroke-width="0.9"/>
    <!-- temple arms -->
    <line x1="64.5" y1="89" x2="60" y2="90" stroke="#3A3F44" stroke-width="0.9"/>
    <line x1="95.5" y1="89" x2="100" y2="90" stroke="#3A3F44" stroke-width="0.9"/>
    <!-- eyes — focused, calm -->
    <circle cx="71" cy="89" r="1.5" fill="#1A1A1A"/>
    <circle cx="89" cy="89" r="1.5" fill="#1A1A1A"/>
    <!-- nose -->
    <path d="M80 92 L 78 99 L 82 99" fill="none" stroke="#C9A180" stroke-width="0.8" stroke-linecap="round"/>
    <!-- mouth — slight warm smile, composed -->
    <path d="M74 106 Q 80 109 86 106" fill="none" stroke="#8B5C4A" stroke-width="1.3" stroke-linecap="round"/>
    <!-- subtle jawline definition -->
    <path d="M58 100 Q 68 116 80 118 Q 92 116 102 100" fill="none" stroke="#D4B595" stroke-width="0.5"/>
  </g>
  <circle cx="80" cy="80" r="78" fill="none" stroke="#0A2540" stroke-width="1.5"/>
  <!-- prop badge — orchestration / kanban -->
  <g transform="translate(118,118)">
    <circle r="20" fill="#FFFFFF" stroke="#0A2540" stroke-width="1.2"/>
    <!-- 3 column kanban hint -->
    <rect x="-12" y="-10" width="6" height="20" rx="1" fill="none" stroke="#0A2540" stroke-width="0.6"/>
    <rect x="-4" y="-10" width="6" height="20" rx="1" fill="none" stroke="#0A2540" stroke-width="0.6"/>
    <rect x="4" y="-10" width="6" height="20" rx="1" fill="none" stroke="#0A2540" stroke-width="0.6"/>
    <!-- cards in columns -->
    <rect x="-11" y="-8" width="4" height="3" fill="#FFB800"/>
    <rect x="-11" y="-3" width="4" height="3" fill="#1F8FFF"/>
    <rect x="-3" y="-8" width="4" height="3" fill="#1F8FFF"/>
    <rect x="-3" y="-3" width="4" height="3" fill="#1FA055"/>
    <rect x="5" y="-8" width="4" height="3" fill="#1FA055"/>
    <!-- column headers - tiny dots -->
    <circle cx="-9" cy="6" r="0.7" fill="#5C6F7E"/>
    <circle cx="-1" cy="6" r="0.7" fill="#FFB800"/>
    <circle cx="7" cy="6" r="0.7" fill="#1FA055"/>
  </g>
</svg>
