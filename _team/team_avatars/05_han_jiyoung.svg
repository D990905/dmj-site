<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="메이 한 May Han - UX Research Director">
  <title>메이 한 (May Han) — UX Research Director</title>
  <defs>
    <clipPath id="c5"><circle cx="80" cy="80" r="78"/></clipPath>
  </defs>
  <g clip-path="url(#c5)">
    <rect width="160" height="160" fill="#F8EDE3"/>
    <rect width="160" height="20" y="140" fill="#EBD9C6"/>
    <!-- body — terracotta knit -->
    <path d="M28 160 C 38 128, 58 120, 80 120 C 102 120, 122 128, 132 160 Z" fill="#C77B5C"/>
    <!-- crew neck darker line -->
    <ellipse cx="80" cy="128" rx="14" ry="5" fill="#A35E42"/>
    <!-- neck -->
    <rect x="73" y="108" width="14" height="18" fill="#EDC59F"/>
    <!-- head -->
    <ellipse cx="80" cy="86" rx="26" ry="30" fill="#F2D0B0"/>
    <!-- hair — short brown bob, slightly above shoulder -->
    <path d="M52 78 C 53 56, 70 48, 80 48 C 95 48, 108 58, 108 82 L 105 100 L 100 90 L 96 70 L 80 64 L 64 70 L 58 92 L 55 100 Z" fill="#7A4B2E"/>
    <!-- side wisps -->
    <path d="M54 80 L 56 102 L 62 105 L 60 88 Z" fill="#7A4B2E"/>
    <path d="M106 80 L 104 102 L 98 105 L 100 88 Z" fill="#7A4B2E"/>
    <!-- ears -->
    <ellipse cx="54" cy="89" rx="3" ry="5" fill="#EDC59F"/>
    <!-- earrings - small studs -->
    <circle cx="54" cy="93" r="1.2" fill="#FFB800"/>
    <ellipse cx="106" cy="89" rx="3" ry="5" fill="#EDC59F"/>
    <circle cx="106" cy="93" r="1.2" fill="#FFB800"/>
    <!-- eyebrows -->
    <path d="M65 82 Q 70 80 75 82" fill="none" stroke="#3D2817" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M85 82 Q 90 80 95 82" fill="none" stroke="#3D2817" stroke-width="1.6" stroke-linecap="round"/>
    <!-- eyes — warm, slight curve -->
    <path d="M67 90 Q 71 88 75 90" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M85 90 Q 89 88 93 90" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
    <!-- eyelash hints -->
    <line x1="71" y1="88" x2="71" y2="86" stroke="#1A1A1A" stroke-width="0.8"/>
    <line x1="89" y1="88" x2="89" y2="86" stroke="#1A1A1A" stroke-width="0.8"/>
    <!-- nose -->
    <path d="M80 92 L 78 99 L 82 99" fill="none" stroke="#C9A180" stroke-width="0.8" stroke-linecap="round"/>
    <!-- mouth — warm smile -->
    <path d="M73 105 Q 80 112 87 105" fill="none" stroke="#A04848" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <circle cx="80" cy="80" r="78" fill="none" stroke="#0A2540" stroke-width="1.5"/>
  <!-- prop badge — sticky notes -->
  <g transform="translate(118,118)">
    <circle r="20" fill="#FFFFFF" stroke="#0A2540" stroke-width="1.2"/>
    <rect x="-9" y="-9" width="9" height="9" fill="#FFD966" transform="rotate(-8 -4.5 -4.5)"/>
    <rect x="-2" y="-7" width="9" height="9" fill="#FF9999" transform="rotate(6 2.5 -2.5)"/>
    <rect x="-5" y="0" width="9" height="9" fill="#80CFE5" transform="rotate(-3 -0.5 4.5)"/>
  </g>
</svg>
