<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="캔 최 Ken Choi - Marketing and Social Manager">
  <title>캔 최 (Ken Choi) — Marketing &amp; Social Manager</title>
  <defs>
    <clipPath id="c6"><circle cx="80" cy="80" r="78"/></clipPath>
  </defs>
  <g clip-path="url(#c6)">
    <rect width="160" height="160" fill="#FFF5DC"/>
    <rect width="160" height="20" y="140" fill="#F2E0AC"/>
    <!-- body — Patagonia retro pile fleece (multicolor stripes) -->
    <path d="M28 160 C 38 128, 58 120, 80 120 C 102 120, 122 128, 132 160 Z" fill="#D88860"/>
    <path d="M28 160 C 38 142, 58 138, 80 138 C 102 138, 122 142, 132 160 Z" fill="#7A4B2E"/>
    <path d="M28 160 C 38 150, 58 148, 80 148 C 102 150, 122 150, 132 160 Z" fill="#3F5D3F"/>
    <!-- fleece texture dots -->
    <circle cx="55" cy="135" r="1" fill="#A35E42" opacity="0.6"/>
    <circle cx="70" cy="132" r="1" fill="#A35E42" opacity="0.6"/>
    <circle cx="95" cy="132" r="1" fill="#A35E42" opacity="0.6"/>
    <circle cx="108" cy="135" r="1" fill="#A35E42" opacity="0.6"/>
    <!-- brand wristband hint at bottom right (chest strap visible) -->
    <rect x="105" y="138" width="14" height="3" fill="#FFB800" rx="1"/>
    <!-- neck (wider — male) -->
    <rect x="71" y="108" width="18" height="18" fill="#E5B58A"/>
    <!-- adam's apple hint -->
    <ellipse cx="80" cy="119" rx="2" ry="3" fill="#C9A180" opacity="0.5"/>
    <!-- head -->
    <ellipse cx="80" cy="86" rx="26" ry="30" fill="#F2D0B0"/>
    <!-- jaw — squarer -->
    <path d="M58 100 Q 68 116 80 118 Q 92 116 102 100 L 102 110 Q 92 120 80 122 Q 68 120 58 110 Z" fill="#F2D0B0"/>
    <!-- NY Yankees-style black cap -->
    <path d="M48 72 C 48 50, 68 42, 80 42 C 92 42, 112 50, 112 72 L 112 78 L 48 78 Z" fill="#1A1A1A"/>
    <!-- cap visor -->
    <path d="M44 78 Q 80 80 116 78 L 112 84 Q 80 86 48 84 Z" fill="#1A1A1A"/>
    <!-- cap small logo (sun = SailTechCo) -->
    <circle cx="80" cy="60" r="4" fill="#FFB800"/>
    <circle cx="80" cy="60" r="2.5" fill="#1A1A1A"/>
    <!-- short shaved sides — visible -->
    <path d="M52 74 L 52 92 L 56 92 L 56 80 Z" fill="#2A2520"/>
    <path d="M108 74 L 108 92 L 104 92 L 104 80 Z" fill="#2A2520"/>
    <!-- ears (visible — short hair) -->
    <ellipse cx="54" cy="92" rx="3.5" ry="6" fill="#EDC59F"/>
    <ellipse cx="106" cy="92" rx="3.5" ry="6" fill="#EDC59F"/>
    <!-- eyebrows — straight, masculine -->
    <rect x="66" y="84" width="10" height="2.2" fill="#1A1A1A" rx="0.5"/>
    <rect x="84" y="84" width="10" height="2.2" fill="#1A1A1A" rx="0.5"/>
    <!-- big round black-frame glasses -->
    <circle cx="71" cy="91" r="8" fill="none" stroke="#1A1A1A" stroke-width="1.8"/>
    <circle cx="89" cy="91" r="8" fill="none" stroke="#1A1A1A" stroke-width="1.8"/>
    <line x1="79" y1="91" x2="81" y2="91" stroke="#1A1A1A" stroke-width="1.8"/>
    <!-- temples (visible past glasses) -->
    <line x1="63" y1="91" x2="59" y2="91" stroke="#1A1A1A" stroke-width="1.2"/>
    <line x1="97" y1="91" x2="101" y2="91" stroke="#1A1A1A" stroke-width="1.2"/>
    <!-- eyes — bright, friendly -->
    <circle cx="71" cy="91" r="1.8" fill="#1A1A1A"/>
    <circle cx="89" cy="91" r="1.8" fill="#1A1A1A"/>
    <circle cx="72" cy="90" r="0.6" fill="#FFFFFF"/>
    <circle cx="90" cy="90" r="0.6" fill="#FFFFFF"/>
    <!-- nose — slightly wider -->
    <path d="M80 95 L 77 102 L 83 102 Z" fill="none" stroke="#C9A180" stroke-width="0.9" stroke-linecap="round"/>
    <!-- mouth — wide grin -->
    <path d="M70 108 Q 80 116 90 108" fill="none" stroke="#7A4838" stroke-width="1.8" stroke-linecap="round"/>
    <!-- teeth hint -->
    <path d="M74 110 Q 80 112 86 110" fill="#FFFFFF" stroke="#7A4838" stroke-width="0.5"/>
    <!-- subtle stubble shadow -->
    <ellipse cx="80" cy="115" rx="18" ry="3.5" fill="#A8825F" opacity="0.2"/>
  </g>
  <circle cx="80" cy="80" r="78" fill="none" stroke="#0A2540" stroke-width="1.5"/>
  <!-- prop badge — camera -->
  <g transform="translate(118,118)">
    <circle r="20" fill="#FFFFFF" stroke="#0A2540" stroke-width="1.2"/>
    <rect x="-12" y="-6" width="24" height="14" rx="2" fill="#1A1A1A"/>
    <rect x="-4" y="-9" width="8" height="3" fill="#1A1A1A"/>
    <circle cx="0" cy="1" r="5" fill="#3A3F44" stroke="#1A1A1A" stroke-width="0.5"/>
    <circle cx="0" cy="1" r="3" fill="#1F8FFF"/>
    <circle cx="-1" cy="0" r="0.8" fill="#FFFFFF"/>
    <circle cx="8" cy="-3" r="0.8" fill="#FFB800"/>
  </g>
</svg>
