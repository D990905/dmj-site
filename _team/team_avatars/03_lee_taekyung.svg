<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="티모 강 Timo Kang - Sports Science Researcher PhD">
  <title>티모 강 (Timo Kang), PhD — Sports Science Researcher</title>
  <defs>
    <clipPath id="c3"><circle cx="80" cy="80" r="78"/></clipPath>
  </defs>
  <g clip-path="url(#c3)">
    <rect width="160" height="160" fill="#EFF0E6"/>
    <rect width="160" height="20" y="140" fill="#D9DDCB"/>
    <!-- body — olive Patagonia pullover -->
    <path d="M28 160 C 38 128, 58 120, 80 120 C 102 120, 122 128, 132 160 Z" fill="#5B6A3E"/>
    <!-- zip line -->
    <line x1="80" y1="125" x2="80" y2="160" stroke="#2A331E" stroke-width="1.2"/>
    <!-- neck -->
    <rect x="73" y="108" width="14" height="18" fill="#E5B58A"/>
    <!-- head — slightly leaner -->
    <ellipse cx="80" cy="85" rx="25" ry="29" fill="#E5B58A"/>
    <!-- hair — short, curly, salt-and-pepper -->
    <path d="M55 76 C 56 60, 70 50, 80 50 C 95 50, 105 60, 106 76 L 102 78 L 98 70 Q 90 64 80 64 Q 70 64 62 70 L 58 78 Z" fill="#5C5247"/>
    <!-- texture dots (curly) -->
    <circle cx="65" cy="64" r="1.6" fill="#3D3530"/>
    <circle cx="72" cy="60" r="1.6" fill="#7A6E62"/>
    <circle cx="80" cy="58" r="1.6" fill="#3D3530"/>
    <circle cx="88" cy="60" r="1.6" fill="#7A6E62"/>
    <circle cx="96" cy="64" r="1.6" fill="#3D3530"/>
    <!-- ears -->
    <ellipse cx="55" cy="87" rx="3" ry="5" fill="#E5B58A"/>
    <ellipse cx="105" cy="87" rx="3" ry="5" fill="#E5B58A"/>
    <!-- eyebrows -->
    <rect x="66" y="82" width="9" height="1.6" fill="#3D3530"/>
    <rect x="85" y="82" width="9" height="1.6" fill="#3D3530"/>
    <!-- round wire-frame glasses -->
    <circle cx="71" cy="89" r="7" fill="none" stroke="#2A3B4C" stroke-width="1"/>
    <circle cx="89" cy="89" r="7" fill="none" stroke="#2A3B4C" stroke-width="1"/>
    <line x1="78" y1="89" x2="82" y2="89" stroke="#2A3B4C" stroke-width="1"/>
    <!-- eyes -->
    <circle cx="71" cy="89" r="1.5" fill="#1A1A1A"/>
    <circle cx="89" cy="89" r="1.5" fill="#1A1A1A"/>
    <!-- nose -->
    <path d="M80 92 L 77 100 L 83 100" fill="none" stroke="#A8825F" stroke-width="0.8" stroke-linecap="round"/>
    <!-- mouth — neutral, contemplative -->
    <line x1="74" y1="107" x2="86" y2="107" stroke="#8B5C4A" stroke-width="1.2" stroke-linecap="round"/>
    <!-- subtle stubble shadow on jaw -->
    <ellipse cx="80" cy="113" rx="18" ry="4" fill="#A8825F" opacity="0.18"/>
  </g>
  <circle cx="80" cy="80" r="78" fill="none" stroke="#0A2540" stroke-width="1.5"/>
  <!-- prop badge — equation sigma -->
  <g transform="translate(118,118)">
    <circle r="20" fill="#FFFFFF" stroke="#0A2540" stroke-width="1.2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="20" font-weight="600" fill="#0A2540">∑</text>
    <text x="0" y="13" text-anchor="middle" font-family="Georgia, serif" font-size="5" fill="#5C6F7E">DOI</text>
  </g>
</svg>
