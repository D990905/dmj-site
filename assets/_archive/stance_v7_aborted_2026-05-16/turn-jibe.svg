<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" role="img" aria-label="자이빙 방향 다이어그램 — 바람 반대쪽(다운윈드)으로 도는 회전">
  <defs>
    <marker id="ahJibePath" markerWidth="9" markerHeight="9" refX="6.5" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 Z" fill="#0A2540"/>
    </marker>
    <marker id="ahJibeWind" markerWidth="9" markerHeight="9" refX="6.5" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 Z" fill="#1F8FFF"/>
    </marker>
  </defs>
  <!-- wind from top -->
  <line x1="100" y1="10" x2="100" y2="34" stroke="#1F8FFF" stroke-width="3.4" marker-end="url(#ahJibeWind)"/>
  <text x="112" y="24" font-family="'Pretendard',sans-serif" font-size="12" font-weight="800" fill="#1F8FFF">바람</text>
  <!-- downwind zone hint -->
  <path d="M100 170 L70 118 L130 118 Z" fill="#1F8FFF" opacity="0.08"/>
  <!-- trajectory: turn away from wind, tail passes downwind -->
  <path d="M55 46 C58 104 70 150 100 162 C130 150 142 104 145 50"
        fill="none" stroke="#0A2540" stroke-width="3.4" stroke-dasharray="8 6" stroke-linecap="round" marker-end="url(#ahJibePath)"/>
  <!-- board markers (start / through-downwind / end) -->
  <path d="M55 46 l-7 -12 l14 0 Z" fill="#FFB800" transform="rotate(12 55 40)"/>
  <path d="M100 162 l-8 -13 l16 0 Z" fill="#FFB800"/>
  <!-- label -->
  <text x="100" y="200" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="13" font-weight="800" fill="#0A2540">자이빙 — 바람 반대쪽(다운윈드) 통과</text>
</svg>
