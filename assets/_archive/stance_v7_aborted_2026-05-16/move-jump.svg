<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" role="img" aria-label="점핑 다이어그램 — 이륙·공중·착지 궤적">
  <defs>
    <marker id="ahJump" markerWidth="9" markerHeight="9" refX="6.5" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 Z" fill="#0A2540"/>
    </marker>
  </defs>
  <!-- water line -->
  <path d="M14 150 q10 -7 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#1F8FFF" stroke-width="2.4" opacity="0.7"/>
  <line x1="14" y1="160" x2="186" y2="160" stroke="#1F8FFF" stroke-width="1.4" opacity="0.3"/>
  <!-- jump trajectory (parabola) -->
  <path d="M40 146 C60 60 140 60 160 146" fill="none" stroke="#0A2540" stroke-width="3.4" stroke-dasharray="8 6" stroke-linecap="round" marker-end="url(#ahJump)"/>
  <!-- takeoff board -->
  <g transform="rotate(-26 40 146)"><rect x="22" y="141" width="36" height="10" rx="5" fill="#0A2540"/></g>
  <!-- airborne board (apex) -->
  <g transform="rotate(6 100 64)"><rect x="82" y="59" width="36" height="10" rx="5" fill="#FFB800"/></g>
  <!-- landing board -->
  <g transform="rotate(26 160 146)"><rect x="142" y="141" width="36" height="10" rx="5" fill="#0A2540"/></g>
  <!-- stage labels -->
  <text x="36" y="176" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="10.5" font-weight="700" fill="#5C6F7E">이륙</text>
  <text x="100" y="44" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="10.5" font-weight="800" fill="#E0A100">공중</text>
  <text x="164" y="176" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="10.5" font-weight="700" fill="#5C6F7E">착지</text>
  <!-- label -->
  <text x="100" y="200" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="13" font-weight="800" fill="#0A2540">점핑 — 이륙·공중·착지</text>
</svg>
