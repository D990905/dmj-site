<?xml version="1.0" encoding="UTF-8"?>
<!-- §173-C v5 — (DEPRECATED 2026-05-16) 옛 "대니" 플랫 마스코트.
     §173-D 결정: 정체성 "대니" → "Coach Danny" 변경 + 아바타 Danny 실제 사진으로 복원.
     이 SVG 는 더 이상 챗 widget 에 사용되지 않음 — 파일은 history 보존용 으로 유지.
     active avatar = agent-deny-photo-{48,80,160,240}.{webp,png}. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Coach Danny — 단무지공방 윙포일 어드바이저 (deprecated 마스코트)">
  <!-- 배경 원 (소프트 하늘색) -->
  <circle cx="100" cy="100" r="100" fill="#BCE4F4"/>
  <!-- 하단 바다 띠 -->
  <path d="M 0 150 Q 50 142 100 148 T 200 150 L 200 200 L 0 200 Z" fill="#1F8FFF" opacity="0.9"/>
  <path d="M 0 162 Q 60 156 100 162 T 200 162 L 200 200 L 0 200 Z" fill="#0A2540" opacity="0.55"/>
  <!-- 작은 태양 -->
  <circle cx="160" cy="44" r="13" fill="#FFB800"/>

  <!-- ===== 캐릭터 (head + shoulders, 플랫) ===== -->
  <!-- 어깨 / 흰 티셔츠 -->
  <path d="M 52 200 Q 50 168 78 158 L 122 158 Q 150 168 148 200 Z" fill="#FFFFFF"/>
  <path d="M 52 200 Q 50 168 78 158 L 122 158 Q 150 168 148 200 Z" fill="none" stroke="#0A2540" stroke-width="3"/>
  <!-- 티셔츠 칼라 -->
  <path d="M 86 158 Q 100 168 114 158" fill="none" stroke="#0A2540" stroke-width="3" stroke-linecap="round"/>

  <!-- 목 -->
  <rect x="90" y="138" width="20" height="22" rx="6" fill="#E0A878"/>

  <!-- 귀 -->
  <circle cx="58" cy="98" r="9" fill="#E0A878" stroke="#0A2540" stroke-width="3"/>
  <circle cx="142" cy="98" r="9" fill="#E0A878" stroke="#0A2540" stroke-width="3"/>

  <!-- 머리 (둥근 사각, 따뜻한 톤, 플랫) -->
  <rect x="58" y="58" width="84" height="86" rx="38" fill="#E8B584" stroke="#0A2540" stroke-width="3.5"/>

  <!-- 곱슬머리 (옆 — 단순 동그라미 묶음) -->
  <circle cx="60" cy="78" r="11" fill="#1A1410"/>
  <circle cx="56" cy="92" r="9" fill="#1A1410"/>
  <circle cx="140" cy="78" r="11" fill="#1A1410"/>
  <circle cx="144" cy="92" r="9" fill="#1A1410"/>

  <!-- ===== 트러커 캡 (블랙 크라운 + 화이트 프론트 패널) ===== -->
  <!-- 크라운 -->
  <path d="M 60 74 Q 62 44 100 42 Q 138 44 140 74 Z" fill="#1A1A1A"/>
  <!-- 화이트 프론트 패널 -->
  <path d="M 80 74 Q 80 50 100 48 Q 120 50 120 74 Z" fill="#FFFFFF"/>
  <!-- 챙 -->
  <path d="M 54 74 Q 100 84 146 74 Q 146 80 142 82 Q 100 90 58 82 Q 54 80 54 74 Z" fill="#0A2540"/>
  <!-- 캡 패치 (단순 노란 원) -->
  <circle cx="100" cy="61" r="8" fill="#FFB800" stroke="#0A2540" stroke-width="2.5"/>
  <path d="M 95 63 Q 100 60 105 63" stroke="#0A2540" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- ===== 얼굴 (단순·친근) ===== -->
  <!-- 눈썹 -->
  <path d="M 74 96 Q 82 92 90 95" stroke="#1A1410" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 110 95 Q 118 92 126 96" stroke="#1A1410" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- 눈 (단순 동그라미 + 하이라이트) -->
  <circle cx="82" cy="105" r="6" fill="#1A1410"/>
  <circle cx="84" cy="103" r="2" fill="#FFFFFF"/>
  <circle cx="118" cy="105" r="6" fill="#1A1410"/>
  <circle cx="120" cy="103" r="2" fill="#FFFFFF"/>
  <!-- 볼터치 -->
  <circle cx="74" cy="118" r="6" fill="#F08C6E" opacity="0.55"/>
  <circle cx="126" cy="118" r="6" fill="#F08C6E" opacity="0.55"/>
  <!-- 코 (작은 점) -->
  <circle cx="100" cy="116" r="2.5" fill="#C98B5E"/>
  <!-- 콧수염 (단순 플랫 — Danny iconic) -->
  <path d="M 84 124 Q 92 120 100 123 Q 108 120 116 124 Q 110 130 100 127 Q 90 130 84 124 Z" fill="#1A1410"/>
  <!-- 미소 -->
  <path d="M 86 130 Q 100 140 114 130" stroke="#8C3A2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- 반짝임 액센트 -->
  <g fill="#FFB800">
    <path d="M 44 56 l 2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z"/>
  </g>
</svg>
