# .html5validator.yaml — HTML validity 검사 설정 (pr-check.yml html-validity job)
# By 알렉스 박 (Alex Park, #4 Frontend Engineer) · 2026-06-03 · dispatch D-2026-06-02-008
#
# 왜 config 파일?  action 의 `extra:` 입력은 entrypoint 에서 unquoted 전개 → 공백 포함
#   --ignore-re 정규식이 단어 분할돼 깨짐. config YAML 은 html5validator 가 직접 파싱하므로
#   공백 패턴이 안전하게 유지됨.
#
# root = repo root (배포 콘텐츠 위치 · `site/` 디렉터리는 이 repo 에 없음).
root: .

# 배포 대상 아닌 internal/dev 디렉터리 + 독립 sub-app 제외 (검사 noise 차단).
blacklist:
  - _archive
  - _team
  - _build
  - _experts
  - _research
  - _specs
  - _assets
  - _mapping_review
  - _qa_audit
  - _qa_screenshots
  - orchestrator
  - supabase
  - docs
  - admin
  - riding-dashboard
  - calculator-pwa
  - _fragments

# error 만 fail · warning 통과
log: WARNING

# ── 기존 systemic backlog 패턴만 한정 suppress (회귀 아님) ──────────────────────
# NEW 결함(다른 메시지)은 계속 error → fail = 회귀 가드 유지 (fail-soft 아님).
# TODO(Phase 2 sprint 2): head/nav 공통 템플릿 + accordion/정의리스트 컴포넌트 정리 후 축소.
#   · "…after the first 1024 bytes"  = §172 head SW script 가 <meta charset> 를 1024B 밖으로 밀어냄
#   · "aria-controls …same document" = 모바일 nav #mobile-menu = JS 런타임 주입 (정적 DOM 부재)
#   · "Illegal character …space …"   = data-uri SVG favicon 의 미encode 공백
#   · "…child of element button"      = accordion <button> 안 <h3>/<p> (phrasing 외)
#   · "…child of element li"          = <li> 안 <dt>/<dd> 정의리스트 중첩
#   · "…child of element div"         = <dl> 컨텍스트 div 안 <span>
#   · "missing a required instance …" = <div role=…> dt/dd 누락
#   · "CSS: apply: Parse Error"        = Tailwind @apply (vnu 미인식 false-positive)
#   · "style …child of element main"  = product 페이지 <main> 내 scoped <style>
ignore_re:
  - "found after the first 1024 bytes"
  - "aria-controls. attribute must point to an element in the same document"
  - "Illegal character in scheme data: space is not allowed"
  - "not allowed as child of element .button."
  - "not allowed as child of element .li."
  - "not allowed as child of element .div."
  - "is missing a required instance of child element"
  - "CSS: .apply.: Parse Error"
  - "Element .style. not allowed as child of element .main."
