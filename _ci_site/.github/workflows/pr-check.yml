# .github/workflows/pr-check.yml
# PR 자동 검증 — HTML validity + 깨진 link check
# By 알렉스 박 (Alex Park, #4 Frontend Engineer) · 2026-06-02 · Phase 2 sprint 1
# Companion to static.yml (deploy) — pr-check.yml = 변경 가드.
#
# ─────────────────────────────────────────────────────────────────────────────
# 2026-06-03 CI green fix (Alex Park · dispatch D-2026-06-02-008)
#   원인: 첫 run 2 job 실패 = 콘텐츠 결함이 아니라 path 설정 버그였음.
#         이 repo 는 배포 콘텐츠가 repo ROOT 에 있음 (static.yml `path: '.'`).
#         그런데 두 job 모두 존재하지 않는 `site/` 를 가리켜서:
#           - html5validator → "There are no files to check" → exit 1
#           - hyperlink      → 존재하지 않는 경로 walk → exit 1
#         (GitHub Actions UI 의 "annotations 2 / 1" = Node20 deprecation 경고 +
#          exit-code 일반 annotation 이었음. 파일·라인 지목 콘텐츠 annotation 아님.)
#   재현: html5validator-2 1.1.5 (action 동일) · vnu 25.8.8 · hyperlink 0.1.32 로컬 검증.
#   fix:  root 를 실제 콘텐츠 위치(repo root)로 정정 + 배포 대상 아닌 internal/dev
#         디렉터리(_archive/_team/_qa_screenshots/orchestrator/… + WIP sub-app)는
#         검사 범위에서 제외. 추가로 실제 깨진 링크 2건 + HTML markup 8건 in-place 교정.
#   교정한 실제 콘텐츠 결함 (DO_NOT_REVERT — 회귀 가드):
#     · products/ppc/r1.html        x-sell 이미지 ppc-sonic-fds.jpg → ppc-fds-sonic.jpg (실파일명)
#     · profile.html                §D My Gear <section> 에 id="my-gear" 추가 (membership 딥링크 타깃)
#     · ppc.html                    compare-table-wrap 중복 class 속성 병합
#     · index/calculator/premium    <link rel=stylesheet as=style> → as 제거 (as 는 preload 전용)
#     · calculator.html             물리모델 본문 미escape "<" → &lt; / <p> 안 <details> → <div> 전환
#     · products/wip/boots.html     meta refresh content "0;url=" → "0; url=" (공백)
#     · products/wip/harness.html   <body> 내 invalid meta http-equiv refresh 제거 (head 에 이미 존재)
#   ignore-re (아래 html5validator step): 페이지 전반 systemic 잔여 backlog —
#         JS 런타임 주입 #mobile-menu(aria-controls) · §172 head script 뒤 charset>1024B ·
#         data-uri favicon 공백 · accordion <button> 내 <h3>/<p> · <li> 안 <dt>/<dd> ·
#         Tailwind @apply false-positive 등. 회귀가 아닌 기존 부채라 fail 시키지 않되,
#         NEW 결함은 계속 잡도록 패턴 한정. TODO(Phase 2 sprint 2): 컴포넌트/head 템플릿 정리 후 ignore 축소.
# ─────────────────────────────────────────────────────────────────────────────
#
# Phase 2 sprint 2 추가 예정:
#   - Lighthouse CI (treosh/lighthouse-ci-action@v11) — LCP/INP/CLS 회귀 알람
#   - axe-core a11y check (Playwright)
#   - Astro build smoke test (Astro migration 시점)

name: PR checks

on:
  pull_request:
    branches: [main]
  # main push 시에도 동일 검증 (단일 안전망)
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html-validity:
    name: HTML validity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HTML5 validator
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          # 설정은 .html5validator.yaml 로 외부화 (root · blacklist · ignore_re).
          # action 의 `extra:` 는 entrypoint 에서 unquoted 전개 → 공백 포함 정규식 깨짐 →
          # config 파일 방식이 안전 (html5validator 가 YAML 직접 파싱).
          config: .html5validator.yaml

  link-check:
    name: Broken link check (internal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage deployable content
        # hyperlink 은 단일 root 만 받고 dir 제외 옵션이 없음 → 배포 대상 콘텐츠만
        # _ci_site/ 로 복사 (internal/dev 디렉터리 + 고아 파편 제외).
        # html-validity job 의 blacklist 와 동일 범위 유지.
        run: |
          rsync -a \
            --exclude='.git/' \
            --exclude='_archive/' --exclude='_team/' --exclude='_build/' \
            --exclude='_experts/' --exclude='_research/' --exclude='_specs/' \
            --exclude='_assets/' --exclude='_mapping_review/' --exclude='_qa_audit/' \
            --exclude='_qa_screenshots/' --exclude='orchestrator/' --exclude='supabase/' \
            --exclude='docs/' --exclude='admin/' --exclude='riding-dashboard/' \
            --exclude='calculator-pwa/' --exclude='products/_fragments/' \
            --exclude='_*.html' \
            --exclude='_ci_site/' \
            ./ _ci_site/

      - name: Hyperlink check
        # untitaker/hyperlink — 정적 사이트 internal link 만 검증 (외부 fetch X · 빠름)
        # hard-404 (exit 1) 만 fail. --check-anchors 는 보류:
        # 기존 deep-link anchor drift backlog 13건 (levitaz#boards, wip#harness 등) 가
        # exit 2 warning 으로 job 을 빨갛게 만듦 — 회귀 아닌 기존 부채라 별도 정리.
        # TODO(Phase 2 sprint 2): 타깃 섹션 id 보강 후 --check-anchors 복원.
        uses: untitaker/hyperlink@0.1.32
        with:
          args: _ci_site/ --sources _ci_site/

  ci-summary:
    name: PR check summary
    runs-on: ubuntu-latest
    needs: [html-validity, link-check]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## PR check 결과" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| HTML validity | ${{ needs.html-validity.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Link check | ${{ needs.link-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Phase 2 sprint 2 추가 예정 — Lighthouse CI · axe a11y · Astro build smoke test" >> $GITHUB_STEP_SUMMARY
