<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SailTech">
<meta name="description" content="SailTech Orchestrator Dashboard — 8 expert fleet 작업 가시화">
<title>SailTech Orchestrator</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
</head>
<body>
<header class="topbar" role="banner">
  <div class="topbar-left">
    <span class="brand" aria-label="SailTech"><span class="brand-mark">⚓</span><span class="brand-text">SailTech</span></span>
    <span class="env-tag">prototype</span>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="filterBtn" aria-label="filter">⚙</button>
    <button class="icon-btn" id="refreshBtn" aria-label="refresh">↻</button>
    <button class="icon-btn notif" id="notifBtn" aria-label="notifications">
      <span class="dot-badge" id="notifDot">3</span>
    </button>
    <button class="avatar" id="dannyAvatar" type="button" title="옥대표님 panel" aria-label="옥대표님 panel — 결정 대기 · 진행 · 비용 · 최근 결정">D</button>
  </div>
</header>

<!-- PR 3 — DavidOfflineBanner (조건부, daemon offline 시 노출) -->
<div class="david-banner" id="davidBanner" role="status" aria-live="polite" hidden>
  <span class="david-banner__icon" aria-hidden="true">⏳</span>
  <span class="david-banner__text">David offline · manual dispatch active</span>
  <span class="david-banner__eta">복구 ETA: <span data-eta>—</span></span>
  <button class="david-banner__close" type="button" id="davidBannerClose" aria-label="배너 일시 숨김">×</button>
</div>

<main class="layout">
  <section class="canvas-wrap" id="canvasWrap">
    <div id="cy" role="img" aria-label="orchestrator mindmap"></div>

    <div class="legend" aria-hidden="true">
      <span><i class="lg-dot c-green"></i>완료</span>
      <span><i class="lg-dot c-yellow"></i>진행</span>
      <span><i class="lg-dot c-red"></i>차단</span>
      <span><i class="lg-dot c-gray"></i>대기</span>
      <span><i class="lg-dot c-blue"></i>승인대기</span>
    </div>

    <div class="canvas-controls">
      <button class="ctrl-btn" id="fitBtn" aria-label="fit">⊡</button>
      <button class="ctrl-btn" id="zoomInBtn" aria-label="zoom in">＋</button>
      <button class="ctrl-btn" id="zoomOutBtn" aria-label="zoom out">−</button>
    </div>

    <!-- PR 2 — PriorityLane (대표님 ①②③ 우선순위) -->
    <aside class="priority-lane" id="priorityLane" aria-label="대표님 우선순위">
      <h3 class="priority-lane__title">우선순위</h3>
      <ol class="priority-lane__list" id="priorityList" role="list">
        <!-- runtime injected by renderPriority() -->
      </ol>
    </aside>

    <div class="status-bar">
      <span><b id="statTotal">0</b> directives</span>
      <span><b id="statRun">0</b> 진행</span>
      <span><b id="statBlock">0</b> 차단</span>
      <span><b id="statApprove">0</b> 승인대기</span>
      <span class="status-cost" title="오늘 사용 / 월 cap"><b id="statCostDay">$0</b> · <span id="statCostMonth">$0/$0</span></span>
      <span class="status-meta">
        <i id="daemonDot" class="dmn-dot dmn-down" title="daemon 상태"></i>
        <span id="lastSync">—</span>
      </span>
    </div>
  </section>

  <aside class="side-panel" id="sidePanel" aria-hidden="true">
    <div class="panel-header">
      <div>
        <div class="panel-eyebrow" id="panelEyebrow">SELECTION</div>
        <div class="panel-title" id="selectedTitle">노드 선택</div>
      </div>
      <button class="close-btn" id="closePanel" aria-label="close">×</button>
    </div>
    <div class="panel-body" id="panelBody">
      <p class="hint">중앙 mindmap 에서 expert 또는 task 노드를 탭하면 상세가 여기 표시됩니다.</p>
    </div>
  </aside>

  <button class="fab" id="newDirectiveBtn" aria-label="new directive" title="새 지시 (Phase 3)">＋</button>

  <div class="bottom-sheet" id="bottomSheet" aria-hidden="true">
    <button class="sheet-handle" id="sheetHandle" aria-label="toggle approval queue"></button>
    <div class="sheet-header">
      <span class="sheet-title">승인 큐</span>
      <span class="badge" id="approvalCount">0</span>
    </div>
    <div class="sheet-body" id="sheetBody"></div>

    <!-- PR 1 — DecisionFeed (최근 결정 5건, bottom-sheet 의 두 번째 section) -->
    <section class="decision-feed" id="decisionFeed" aria-label="최근 결정">
      <header class="decision-feed__head">
        <h3 class="decision-feed__title">최근 결정</h3>
        <span class="decision-feed__count" id="decisionCount">0</span>
      </header>
      <ol class="decision-feed__list" id="decisionList" role="list">
        <!-- runtime injected by renderDecisions() -->
      </ol>
    </section>
  </div>
</main>

<script src="data.sample.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW register failed', err));
  });
}
</script>
</body>
</html>
