<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <linearGradient id="hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- spokes -->
  <g stroke="#3b82f6" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <line x1="256" y1="256" x2="256" y2="96"/>
    <line x1="256" y1="256" x2="369" y2="142"/>
    <line x1="256" y1="256" x2="416" y2="256"/>
    <line x1="256" y1="256" x2="369" y2="369"/>
    <line x1="256" y1="256" x2="256" y2="416"/>
    <line x1="256" y1="256" x2="142" y2="369"/>
    <line x1="256" y1="256" x2="96"  y2="256"/>
    <line x1="256" y1="256" x2="142" y2="142"/>
  </g>
  <!-- expert nodes -->
  <g fill="#60a5fa">
    <circle cx="256" cy="96"  r="22"/>
    <circle cx="369" cy="142" r="22"/>
    <circle cx="416" cy="256" r="22"/>
    <circle cx="369" cy="369" r="22"/>
    <circle cx="256" cy="416" r="22"/>
    <circle cx="142" cy="369" r="22"/>
    <circle cx="96"  cy="256" r="22"/>
    <circle cx="142" cy="142" r="22"/>
  </g>
  <!-- hub -->
  <circle cx="256" cy="256" r="60" fill="url(#hub)" stroke="#e8ecf4" stroke-width="4"/>
  <text x="256" y="276" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="64" font-weight="800" fill="#ffffff">⚓</text>
</svg>
