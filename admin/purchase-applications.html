<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>구매 신청 관리 | DMJ</title><style>html:not([data-admin-authorized="true"]) body>:not(#admin-access-notice){display:none!important}html[data-admin-authorized="true"] #admin-access-notice{display:none!important}#admin-access-notice{max-width:620px;margin:12vh auto;padding:28px;font:16px/1.7 system-ui}table{border-collapse:collapse;min-width:900px;width:100%}th,td{padding:12px;border:1px solid #ddd;text-align:left}#applications-table{overflow:auto}</style><script defer src="access-guard.js?v=20261013-server-role"></script><script defer src="../assets/js/supabase-auth.js?v=20261001-drafts"></script><script defer src="purchase-applications.js?v=20261104"></script><link rel="stylesheet" href="../assets/css/commerce.css?v=20261013-reviewed-ui"><link rel="stylesheet" href="../assets/css/purchase-application.css?v=20261104"></head><body class="commerce"><header class="store-header"><a class="wordmark" href="index.html">DMJ<span>ADMINISTRATION</span></a><a href="index.html">관리자</a></header><main class="section purchase-application"><h1>구매 신청 관리</h1><p id="purchase-admin-status" role="status">관리자 권한을 확인하고 있습니다.</p><div id="purchase-admin-content" hidden><p>실제 입금과 재고를 확인한 뒤 처리하세요. 아래 금액·연락처·배송지는 관리자에게만 표시됩니다.</p><button id="purchase-admin-refresh" type="button">새로고침</button><div id="applications-table"></div><details><summary>구매 신청 운영 설정</summary><p>계좌·예금주·배송비·배송 기산일·개인정보 보유기간·기존 운영자 문자 수신처를 확인하기 전에는 활성화하지 마세요.</p><form id="purchase-settings-form"><fieldset><legend>운영 정보</legend><label>은행<input name="bank_name" maxlength="80"></label><label>입금 계좌<input name="bank_account" maxlength="80"></label><label>예금주<input name="account_holder" maxlength="80"></label><label>배송비<input name="shipping_fee_krw" type="number" min="0" step="1"></label><label>배송 적용 국가·지역<input name="shipping_scope" maxlength="200"></label><label>배송 기간 기산일 기준<input name="delivery_basis" maxlength="300" placeholder="운영자가 확인한 기준을 입력하세요"></label><label>개인정보 보유기간 (일)<input name="retention_days" type="number" min="1" max="3650"></label><label>수집·이용 고지<textarea name="privacy_notice" maxlength="6000" placeholder="수집 항목·목적·보유기간·위탁 처리를 확인한 고지를 입력하세요"></textarea></label></fieldset><label><input type="checkbox" name="notification_destination_confirmed"> 기존 운영자 문자 수신처를 확인했습니다.</label><label><input type="checkbox" name="retention_operation_confirmed"> 보유기간에 맞는 개인정보 파기 운영을 확인했습니다.</label><label><input type="checkbox" name="enabled"> 필수 정보를 확인했고 구매 신청을 활성화합니다.</label><button class="button dark" type="submit">운영 설정 저장</button><p id="purchase-settings-status" role="status"></p></form></details></div></main></body></html>
